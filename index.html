<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/on_logo_navy.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The pre-hydration value only. src/theme/ThemeProvider.jsx rewrites this
         on every load to the ladder's --bg (light #faf1f5 / dark #180f14,
         THEMES.md §6.2), so the static default must be the light ladder's --bg
         or the phone status bar flashes the retired legacy cream first. -->
    <meta name="theme-color" content="#faf1f5" />
    <meta
      name="description"
      content="Oliver Nguyen — I love to build things. Projects, tools, and experiments."
    />
    <link rel="apple-touch-icon" href="/on_logo_navy.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand faces (docs/BRAND.md §7 / D-07, D-08):
         Familjen Grotesk 700 = display · Hanken Grotesk = sans
         JetBrains Mono = mono BODIES (log, code, transcripts)
         Martian Mono   = mono LABELS (chips, statusline, key hints)
         Big Shoulders is kept ONLY because the frozen legacy :root stack in
         src/styles/theme.css still points --font-display at it. Sakura no
         longer uses it; drop it here when the remaining legacy pages are restyled. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Martian+Mono:wght@400;500;700&family=Big+Shoulders:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>Oliver Nguyen</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
